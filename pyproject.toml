[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[project]
name = "vps"
version = "0.1.0"
description = "A command-line utility for inspecting Unix servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.9",
    "typer>=0.16",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
vps = "vps.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
